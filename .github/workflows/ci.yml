name: CI

on:
  push:
    branches: [main, "hermes/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      E2E_CHROMIUM_PATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Open mode in CI: no PERSONAL_OS_PIN is set by design.
          PERSONAL_OS_DB_PATH: /tmp/personal-os-ci/profile.db

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm exec playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            .artifacts/final-audit/e2e-html/
          retention-days: 7
