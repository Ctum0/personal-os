name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      E2E_CHROMIUM_PATH: ""
      # Every step that can boot the app points at a per-run throwaway database.
      # A shared path would let one step's data (or a previous run's) seed the
      # next — the build step migrates the DB it opens, so this matters.
      SCRATCH: /tmp/personal-os-ci/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose: the action reads `packageManager` from
      # package.json, and specifying both makes it fail with a version conflict
      # before any step runs.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
        env:
          PERSONAL_OS_DB_PATH: ${{ env.SCRATCH }}/unit/profile.db

      - name: Build
        run: pnpm build
        env:
          PERSONAL_OS_DB_PATH: ${{ env.SCRATCH }}/build/profile.db

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (open mode + sign-in gate)
        run: pnpm exec playwright test
        env:
          CI: "true"
          # Credentials for the `authed` project. The digest is PBKDF2 of the
          # fixture password over the fixture salt — test-only values, never a
          # deployment credential.
          E2E_USERNAME: e2e-operator
          E2E_PASSWORD: e2e-fixture-password
          E2E_PASSWORD_SALT: 0123456789abcdef0123456789abcdef
          E2E_PASSWORD_HASH: 6a303efb7b786aed0bc0031f6967910732a8a30fd396b24343e9231afb3d9896
          E2E_SESSION_SECRET: e2e-session-secret-fixed-value-0123456789
          E2E_DB_PATH: ${{ env.SCRATCH }}/e2e/profile.db
          E2E_AUTHED_DB_PATH: ${{ env.SCRATCH }}/e2e/profile-authed.db

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            .artifacts/e2e-html/
          retention-days: 7

  # Deploy only what passed. A push that fails any gate above never reaches the
  # server, which a provider-side webhook cannot guarantee.
  #
  # Deployment is addressed by application UUID rather than by repository URL on
  # purpose: URL-based webhooks match on the exact git remote form, so changing
  # the app's source URL (ssh vs https) silently stops deploys while the webhook
  # still answers 200.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL || 'https://coolify.ctum.org' }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ] || [ -z "${COOLIFY_APP_UUID:-}" ]; then
            echo "::error::COOLIFY_TOKEN and COOLIFY_APP_UUID secrets must be set"
            exit 1
          fi
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Accept: application/json' \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID")
          body=$(printf '%s' "$response" | sed '$d')
          code=$(printf '%s' "$response" | tail -n1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Coolify returned HTTP $code"
            exit 1
          fi
          echo "Deployment queued for $COOLIFY_APP_UUID" 
